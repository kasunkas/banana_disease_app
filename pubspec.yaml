name: mokoguard_ai
description: "MokoGuard AI – Offline Explainable Banana Disease Detection"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  camera: ^0.10.5+9
  image_picker: ^1.0.4
  flutter_litert: ^0.1.16
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  pdf: ^3.10.8
  printing: ^5.11.1
  fl_chart: ^0.65.0
  uuid: ^4.3.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  http: ^1.6.0
  path: ^1.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
    - assets/banana_multitask_model.tflite
